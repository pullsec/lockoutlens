[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockoutlens"
version = "0.1.0"
description = "Lockout-aware Active Directory password auditing and security assessment toolkit."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "pullsec" }
]
dependencies = []

[project.scripts]
lockoutlens = "lockoutlens.cli:main"

[project.urls]
Homepage = "https://github.com/pullsec/lockoutlens"
Repository = "https://github.com/pullsec/lockoutlens"
Issues = "https://github.com/pullsec/lockoutlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
